name: .SP Engine Android Build
on: [push, pull_request, workflow_dispatch]

# 核心修复：设置全局环境变量以适配 Node.js 24
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4 # v4 实际上已经兼容，但强制 Node24 变量会消除警告

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r21e

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Haxe
        # 修复点：如果 krdlab 没更新，我们需要确保环境强制运行
        uses: krdlab/setup-haxe@v1
        with:
          haxe-version: 4.3.4

      - name: Install Libraries
        run: |
          haxelib setup ~/haxelib
          # 使用 --quiet 减少 IO 等待，加上 --notimeout 防止中途断开
          haxelib install lime --quiet
          haxelib install openfl --quiet
          haxelib install flixel --quiet
          haxelib install flixel-addons --quiet
          haxelib install flixel-ui --quiet
          haxelib install hscript --quiet
          haxelib git extension-androidvideo https://github.com/openfl/extension-androidvideo --quiet
          haxelib install hxCodec --quiet
          # 关键：跳过交互式设置，直接强制完成
          haxelib run lime setup android
          haxelib run lime setup -y


      - name: Build Android
        run: haxelib run lime build android -final

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SPEngine-Android
          path: export/release/android/bin/app/build/outputs/apk/release/*.apk
