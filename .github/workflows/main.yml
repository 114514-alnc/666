name: .SP Engine Android Build
on: [push, pull_request, workflow_dispatch]

# 核心修复：设置全局环境变量以适配 Node.js 24
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4 # v4 实际上已经兼容，但强制 Node24 变量会消除警告

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r21e

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Haxe
        # 修复点：如果 krdlab 没更新，我们需要确保环境强制运行
        uses: krdlab/setup-haxe@v1
        with:
          haxe-version: 4.3.4

            - name: Install Libraries
        run: |
          haxelib setup ~/haxelib
          haxelib install lime --quiet
          haxelib install openfl --quiet
          haxelib install flixel --quiet
          haxelib install flixel-addons --quiet
          haxelib install flixel-ui --quiet
          haxelib install hscript --quiet
          haxelib install tjson --quiet
          haxelib install SScript --quiet
          
          # 核心修复 1：flxanimate 必须使用 dev 分支，否则找不到 loadAtlasEx
          haxelib git flxanimate https://github.com/ShadowMario/flxanimate dev --quiet
          
          # 核心修复 2：使用最稳的移动端 Lua 库分支
          haxelib git linc_luajit https://github.com/superpowers04/linc_luajit --quiet
          
          # 核心修复 3：安卓工具与视频库
          haxelib git extension-androidtools https://github.com/MAJigsaw77/extension-androidtools --quiet
          haxelib git hxCodec https://github.com/polybiusproxy/hxCodec --quiet
          
          haxelib run lime setup android
          haxelib run lime setup -y








      - name: Build Android
        run: |
          # 核心修复：手动定义 SDK 和 NDK 的路径
          export ANDROID_SDK=${ANDROID_HOME}
          export ANDROID_NDK_ROOT=${ANDROID_NDK_LATEST_HOME}
          
          # 运行编译
          haxelib run lime build android -final


      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SPEngine-Android
          path: export/release/android/bin/app/build/outputs/apk/release/*.apk
